# ELKH Sticker Store - Experimental Production Docker Compose Override
# This file is not a validated production deployment path for the current app.
# The application is currently wired for SQLite in ELKH/Program.cs, and the
# PostgreSQL and Redis services below are placeholders for future work.

version: '3.8'

services:
  # ====================================
  # Production Application Configuration
  # ====================================
  elkh-app:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${SQLITE_CONNECTION_STRING}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATION_INSIGHTS_CONNECTION_STRING}
      - Logging__LogLevel__Default=Warning
      - Logging__LogLevel__Microsoft.AspNetCore=Error
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ====================================
  # Experimental PostgreSQL Placeholder
  # Not used by the current app startup, which configures SQLite.
  # ====================================
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # ====================================
  # Experimental Redis Placeholder
  # Redis is not currently registered in ELKH/Program.cs.
  # ====================================
  redis:
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ====================================
  # Production Nginx Configuration
  # ====================================
  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

# ====================================
# Experimental Usage
# ====================================
# This override is for documentation and future wiring work, not a supported
# production deployment recipe for the current codebase.
#
# Create .env file with current app-compatible settings:
# SQLITE_CONNECTION_STRING=Data Source=/app/data/elkh.db
# GOOGLE_CLIENT_ID=your-google-client-id
# GOOGLE_CLIENT_SECRET=your-google-client-secret
# APPLICATION_INSIGHTS_CONNECTION_STRING=your-app-insights
# REDIS_PASSWORD=optional-placeholder-password
# POSTGRES_DB=optional-placeholder-db
# POSTGRES_USER=optional-placeholder-user
# POSTGRES_PASSWORD=optional-placeholder-password
# 
# Experimental stack bring-up:
# docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Do not treat this as a validated high-availability deployment.
# Scale examples remain illustrative only:
# docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale elkh-app=3
#