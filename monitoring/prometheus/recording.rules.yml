# ELKH Application Recording Rules
# Pre-computed aggregations for efficient dashboard queries

groups:
  - name: elkh_application_rules
    interval: 30s
    rules:
      # HTTP request rate over 5 minutes
      - record: elkh:http_requests:rate5m
        expr: rate(http_requests_total[5m])
        labels:
          team: platform
          service: elkh

      # 99th percentile request duration
      - record: elkh:http_request_duration:p99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))
        labels:
          team: platform
          service: elkh

      # 95th percentile request duration  
      - record: elkh:http_request_duration:p95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))
        labels:
          team: platform
          service: elkh

      # Active database connections by instance
      - record: elkh:database_connections:active
        expr: sum(database_connections_active) by (instance)
        labels:
          team: platform
          service: elkh

      # Error rate by endpoint
      - record: elkh:http_requests:error_rate5m
        expr: rate(http_requests_total{status=~"4..|5.."}[5m]) / rate(http_requests_total[5m])
        labels:
          team: platform
          service: elkh

  - name: elkh_business_metrics
    interval: 60s
    rules:
      # Orders per minute
      - record: elkh:orders:rate1m
        expr: rate(orders_created_total[1m])
        labels:
          team: business
          service: elkh

      # Revenue per hour
      - record: elkh:revenue:rate1h
        expr: rate(revenue_total[1h])
        labels:
          team: business
          service: elkh

      # Cart abandonment rate
      - record: elkh:cart_abandonment:rate5m
        expr: rate(carts_abandoned_total[5m]) / rate(carts_created_total[5m])
        labels:
          team: business
          service: elkh