name: .NET CI

on:
  push:
    branches: [ main, chore-cleanup ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --verbosity minimal

      - name: Run tests
        run: dotnet test --no-build --verbosity normal

      - name: Setup Node for Playwright e2e
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install and run e2e Playwright tests
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install --with-deps
          npm test

      - name: Install and run tests Playwright tests
        working-directory: ./tests
        run: |
          npm ci
          npx playwright install --with-deps
          npx playwright test
