<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - StickIt</title>
    <link rel="icon" type="image/png" href="/logo-stickit.png" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        
        .offline-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 500px;
            margin: 1rem;
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .offline-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }
        
        .offline-message {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .retry-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 0.5rem;
        }
        
        .retry-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        
        .cached-links {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .cached-links h3 {
            margin-bottom: 1rem;
            font-weight: 300;
        }
        
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .cached-link {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .cached-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .status-indicator {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 0.9rem;
        }
        
        .online {
            background: rgba(76, 175, 80, 0.3) !important;
        }
        
        .offline {
            background: rgba(244, 67, 54, 0.3) !important;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1 class="offline-title">You're Offline</h1>
        <p class="offline-message">
            You are temporarily offline, but StickIt can still serve a few cached pages while the connection comes back.
        </p>
        
        <button class="retry-button" onclick="retryConnection()">
            🔄 Try Again
        </button>
        
        <a href="/" class="retry-button">
            🏠 Go Home
        </a>
        
        <div class="cached-links">
            <h3>Available Offline</h3>
            <div class="link-grid">
                <a href="/" class="cached-link">🏠 Home</a>
                <a href="/Product" class="cached-link">🛍️ Products</a>
                <a href="/Cart" class="cached-link">🛒 Cart</a>
                <a href="/Wishlist" class="cached-link">💖 Wishlist</a>
            </div>
        </div>
        
        <div class="status-indicator" id="status-indicator">
            <span id="status-text">Checking connection...</span>
        </div>
    </div>

    <script>
        // Check online status and auto-retry
        function updateConnectionStatus() {
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');
            
            if (navigator.onLine) {
                statusIndicator.className = 'status-indicator online';
                statusText.textContent = '✅ Connection restored! You can reload the page.';
            } else {
                statusIndicator.className = 'status-indicator offline';
                statusText.textContent = '❌ Still offline. We\'ll keep trying...';
            }
        }
        
        function retryConnection() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                const button = event.target;
                button.textContent = '🔍 Checking...';
                
                setTimeout(() => {
                    if (navigator.onLine) {
                        window.location.reload();
                    } else {
                        button.textContent = '🔄 Try Again';
                        updateConnectionStatus();
                    }
                }, 1000);
            }
        }
        
        // Listen for connection changes
        window.addEventListener('online', () => {
            updateConnectionStatus();
            setTimeout(() => {
                if (navigator.onLine) {
                    window.location.reload();
                }
            }, 1500);
        });
        
        window.addEventListener('offline', updateConnectionStatus);
        
        // Initial status check
        updateConnectionStatus();
        
        // Periodic connection check
        setInterval(updateConnectionStatus, 5000);
        
        // Auto-retry every 10 seconds
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 10000);
    </script>
</body>
</html>
