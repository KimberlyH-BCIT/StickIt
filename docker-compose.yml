services:
  elkh-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: elkh-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: ${DEFAULT_CONNECTION_STRING:-Data Source=/app/Data/app.db;Cache=Shared}
      ConnectionStrings__ImageStoreConnection: ${IMAGESTORE_CONNECTION_STRING:-Data Source=/app/Data/ImageStore.db}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPass: ${SEED_ADMIN_PASSWORD:-}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      PayPal__ClientId: ${PAYPAL_CLIENT_ID:-}
      PayPal__Secret: ${PAYPAL_SECRET:-}
      ReCaptcha__SiteKey: ${RECAPTCHA_SITE_KEY:-}
      ReCaptcha__SecretKey: ${RECAPTCHA_SECRET_KEY:-}
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning
    volumes:
      - ./ELKH/app.db:/app/Data/app.db
      - ./ELKH/ImageStore.db:/app/Data/ImageStore.db
      - ./ELKH/wwwroot:/app/wwwroot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
